<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitar Karbon dan Oksigen · 填图游戏</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f7f8;color:#183f44;font-family:Nunito,'Noto Sans SC',system-ui,sans-serif;font-size:18px}main{max-width:980px;margin:auto;padding:24px 20px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:25px}a{color:#176d74;text-decoration:none;font-weight:650}h1{font-size:clamp(29px,6vw,44px);margin:15px 0}p{line-height:1.65}button,input{font:inherit}button{cursor:pointer;padding:14px 20px;border:0;border-radius:13px;min-height:52px;background:#dfeef0;color:#18494e;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #267f87;outline-offset:3px}button:disabled{cursor:default;opacity:.65}.primary,button[aria-pressed=true]{background:#126d73;color:white}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.info{font-size:15px;color:#58777b}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:25px 0}.question{border:1px solid #d5e4e5;border-radius:22px;background:white;padding:25px;margin:20px 0}.question h2{font-size:17px;color:#58777b;font-weight:600;margin:0 0 22px}.flow{display:grid;grid-template-columns:1fr 32px 1.4fr 32px 1fr;align-items:center;gap:10px}.node{background:#eff6f6;border:1px solid #d7e7e8;border-radius:16px;min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px 8px;font-size:17px;font-weight:650;line-height:1.5}.symbol{font-size:36px;line-height:1.4}.arrow{font-size:25px;color:#548186;text-align:center}.blank label{display:block;font-size:14px;color:#58777b;margin-bottom:8px}.blank input{display:block;min-width:0;width:100%;border:2px dashed #75a5aa;border-radius:12px;padding:14px 10px;background:white;color:#183f44}.hint{font-size:17px;line-height:1.85;margin:23px 0 0;padding-top:18px;border-top:1px solid #e2eded}.feedback{margin-top:18px;border-radius:12px;padding:14px;line-height:1.7;background:#e6f4eb;color:#205d3c}.feedback.wrong{background:#fff0eb;color:#963e29}.question.wrong{border-color:#c77967}.question.correct input{border-color:#32885a}.toolbar{background:white;border:1px solid #d5e4e5;padding:20px;border-radius:20px;margin-top:22px}.name{max-width:220px;border:1px solid #aec9cc;border-radius:12px;padding:12px;font-size:17px}.result{font-weight:700;font-size:21px;margin:15px 0}.hidden{display:none}.tabs{margin:23px 0}footer{color:#68858a;font-size:14px;margin-top:24px}summary{cursor:pointer;font-weight:650;padding:13px 0}.count{color:#126d73;font-weight:750}@media(max-width:620px){main{padding:18px 14px 35px}.question{padding:20px 14px}.flow{grid-template-columns:1fr 20px 1.3fr 20px 1fr;gap:4px}.node{font-size:14px;padding:10px 4px;min-height:112px}.symbol{font-size:29px}.arrow{font-size:22px}.blank input{font-size:16px;padding:12px 6px}.blank label{font-size:13px}.hint{font-size:17px}header{font-size:15px}.row button{flex-grow:1}}@media(max-width:370px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.node{min-height:90px}.blank input{max-width:250px;margin:auto}.blank{text-align:center}}
</style></head><body><main><header><a href="index.html">🌿 返回生态伙伴</a><span class="info">Form 2 Sains · Bab 2</span></header><h1>循环填图游戏</h1><p>保留马来文解释，根据图示和箭头填写国文过程名称。</p><label for="name">名字（可留空） </label><input id="name" class="name" maxlength="40" placeholder="输入名字" autocomplete="given-name"><div class="row tabs"><button id="carbonTab" aria-pressed="true">Kitar Karbon 碳循环</button><button id="oxygenTab" aria-pressed="false">Kitar Oksigen 氧循环</button></div><div class="top"><strong id="title"></strong><span id="count" class="count" aria-live="polite"></span></div><div id="questions"></div><section class="toolbar"><div id="status" role="status" class="result"></div><div class="row"><button id="check" class="primary">检查答案</button><button id="retry" class="hidden">重练错题</button><button id="restart">重新练习</button><button id="next" class="hidden"></button></div><p id="saveNotice" class="info"></p></section><details><summary>怎样玩？</summary><p>先读每幅图下的马来文解释，填写过程名称，然后点击“检查答案”。错题会显示正确名称和华文意思。可以切换循环，两张图合共9个填空。</p></details><footer>成绩仅保存在当前浏览器。箭头表示相关物质的转移、释放或消耗。</footer></main><script>
'use strict';
const bank={
carbon:[
{id:'c1',from:'Karbon dioksida di atmosfera',to:'Tumbuhan hijau',a:'☁️',b:'🌳',hint:'Tumbuhan menggunakan cahaya matahari untuk membuat makanan dengan menyerap karbon dioksida daripada udara.',answer:'Fotosintesis',zh:'光合作用',accepted:['fotosintesis']},
{id:'c2',from:'Tumbuhan, haiwan dan manusia',to:'Karbon dioksida di atmosfera',a:'🌳 🐄 🧑',b:'☁️',hint:'Organisma menguraikan makanan untuk membebaskan tenaga dan membebaskan karbon dioksida ke atmosfera.',answer:'Respirasi',zh:'呼吸作用',accepted:['respirasi']},
{id:'c3',from:'Kayu atau bahan api fosil',to:'Karbon dioksida di atmosfera',a:'🪵',b:'☁️',hint:'Kayu atau bahan api bertindak balas dengan oksigen, lalu membebaskan haba dan karbon dioksida.',answer:'Pembakaran',zh:'燃烧',accepted:['pembakaran']},
{id:'c4',from:'Organisma mati dan sisa organik',to:'Karbon dioksida di atmosfera',a:'🍂',b:'☁️',hint:'Bakteria dan kulat menguraikan bahan-bahan ini, lalu membebaskan karbon dioksida ke persekitaran.',answer:'Penguraian',zh:'分解作用',accepted:['penguraian','pereputan']}
],
oxygen:[
{id:'o1',from:'Tumbuhan hijau',to:'Oksigen di atmosfera',a:'🌳',b:'☁️',hint:'Tumbuhan menggunakan cahaya matahari untuk membuat makanan, menyerap karbon dioksida dan membebaskan oksigen.',answer:'Fotosintesis',zh:'光合作用',accepted:['fotosintesis']},
{id:'o2',from:'Oksigen di atmosfera',to:'Tumbuhan, haiwan dan manusia',a:'☁️',b:'🌳 🐄 🧑',hint:'Organisma menggunakan oksigen untuk menguraikan makanan dan membebaskan tenaga serta karbon dioksida.',answer:'Respirasi',zh:'呼吸作用',accepted:['respirasi']},
{id:'o3',from:'Oksigen di atmosfera',to:'Kayu atau bahan api',a:'☁️',b:'🪵',hint:'Kayu atau bahan api menggunakan oksigen apabila terbakar dan membebaskan haba.',answer:'Pembakaran',zh:'燃烧',accepted:['pembakaran']},
{id:'o4',from:'Oksigen di atmosfera',to:'Organisma mati dan sisa organik',a:'☁️',b:'🍂',hint:'Pengurai menguraikan bahan-bahan ini dalam keadaan beroksigen. Oksigen digunakan dalam proses ini.',answer:'Penguraian',zh:'分解作用',accepted:['penguraian','pereputan']},
{id:'o5',from:'Oksigen di atmosfera',to:'Besi',a:'☁️',b:'🔩',hint:'Besi bertindak balas dengan oksigen dan air, lalu membentuk karat. Oksigen digunakan.',answer:'Pengaratan',zh:'生锈',accepted:['pengaratan']}
]};
const $=id=>document.getElementById(id);
let cycle='carbon',active=bank.carbon,submitted=false,wrong=[],drafts={},records=[];
try{const saved=JSON.parse(localStorage.getItem('eco-cycle-results')||'[]');if(Array.isArray(saved))records=saved}catch{}
function element(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function normalize(value){return value.trim().toLocaleLowerCase('ms').replace(/[.!?。]+$/,'').trim()}
function node(icon,text){const n=element('div',undefined,'node');const picture=element('span',icon,'symbol');picture.setAttribute('aria-hidden','true');n.append(picture,element('span',text));return n}
function render(){
 submitted=false;wrong=[];$('questions').replaceChildren();$('status').textContent='';$('saveNotice').textContent='';$('check').disabled=false;$('retry').classList.add('hidden');$('next').classList.add('hidden');
 $('title').textContent=cycle==='carbon'?'Kitar Karbon · 碳循环':'Kitar Oksigen · 氧循环';
 $('carbonTab').setAttribute('aria-pressed',cycle==='carbon');$('oxygenTab').setAttribute('aria-pressed',cycle==='oxygen');
 active.forEach((q,i)=>{
 const card=element('article',undefined,'question');card.id=q.id;
 card.append(element('h2',`填空 ${i+1} / ${active.length}`));const flow=element('div',undefined,'flow');
 const blank=element('div',undefined,'blank'),label=element('label','Nama proses');label.htmlFor='input-'+q.id;
 const input=element('input');input.id='input-'+q.id;input.type='text';input.autocomplete='off';input.spellcheck=false;input.maxLength=80;input.value=drafts[q.id]||'';input.setAttribute('aria-describedby','hint-'+q.id);input.setAttribute('aria-label',`第 ${i+1} 题的国文过程名称`);input.addEventListener('input',()=>{drafts[q.id]=input.value;count()});
 blank.append(label,input);flow.append(node(q.a,q.from),element('div','→','arrow'),blank,element('div','→','arrow'),node(q.b,q.to));card.append(flow);const hint=element('p',q.hint,'hint');hint.lang='ms';hint.id='hint-'+q.id;card.append(hint);$('questions').append(card);
 });count();window.scrollTo(0,0)
}
function count(){const filled=active.filter(q=>(drafts[q.id]||'').trim()).length;$('count').textContent=`已填写 ${filled} / ${active.length}`}
function check(){
 if(submitted)return;
 const empty=active.find(q=>!(drafts[q.id]||'').trim());if(empty){$('status').textContent='请先填写所有过程名称。';$('input-'+empty.id).focus();return}
 submitted=true;let score=0;
 active.forEach(q=>{const correct=q.accepted.includes(normalize(drafts[q.id]));if(correct)score++;else wrong.push(q);const card=$(q.id);card.classList.add(correct?'correct':'wrong');$('input-'+q.id).disabled=true;const text=correct?`✓ ${q.answer} · ${q.zh}`:`再记一次 · ${q.answer}（${q.zh}）`;const feedback=element('div',text,'feedback'+(correct?'':' wrong'));feedback.setAttribute('role','status');if(q.answer==='Penguraian')feedback.append(element('div','也接受 Pereputan（腐解）。'));card.append(feedback)});
 $('status').textContent=`完成！得分 ${score} / ${active.length}`;$('check').disabled=true;$('retry').classList.toggle('hidden',!wrong.length);$('next').classList.remove('hidden');$('next').textContent=cycle==='carbon'?'练习氧循环':'练习碳循环';
 const record={name:$('name').value.trim()||'同学',cycle,score,total:active.length,date:new Date().toISOString(),wrong:wrong.map(q=>({id:q.id,answer:drafts[q.id],correct:q.answer}))};records.push(record);records=records.slice(-100);try{localStorage.setItem('eco-cycle-results',JSON.stringify(records));$('saveNotice').textContent=`成绩已记录在当前浏览器，共完成 ${records.length} 次。`}catch{$('saveNotice').textContent='浏览器无法保存成绩，本轮仍可查看答案。'}
 $('status').scrollIntoView({block:'center',behavior:'smooth'})
}
function switchCycle(value){cycle=value;active=bank[cycle];render()}
$('carbonTab').onclick=()=>switchCycle('carbon');$('oxygenTab').onclick=()=>switchCycle('oxygen');$('check').onclick=check;
$('retry').onclick=()=>{const remaining=[...wrong];for(const q of remaining)delete drafts[q.id];active=remaining;render()};
$('restart').onclick=()=>{for(const q of bank[cycle])delete drafts[q.id];active=bank[cycle];render()};
$('next').onclick=()=>switchCycle(cycle==='carbon'?'oxygen':'carbon');render();
</script></body></html>
