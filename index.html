function home(){app.innerHTML='<section class="hero"><div><h1 class="home-title">认一个词，<br>懂一种关系。</h1><p class="intro">先认识国文重点字，再用生活例子分辨生物关系。每轮 10 题，点选答案就能查看华文解释。</p><label class="name" for="student">你的名字（可留空）</label><input id="student" autocomplete="given-name" maxlength="40" placeholder="输入名字"><div class="row" style="margin-top:18px" id="start"></div></div><div class="art" aria-hidden="true">🌳 🐝<br>🍄 🌱<p>一起认识生态伙伴</p></div></section><section class="topics"><article class="topic">📖<strong>国文认字</strong><p>先看国文，选择对应的华文意思。</p></article><article class="topic">🌿<strong>情境挑战</strong><p>看看谁获益、谁受害，再选择关系。</p></article><article class="topic">🔁<strong>错题重练</strong><p>做错的重点字，再练一次。</p></article></section><div id="studyButton" class="row"></div><p class="note" id="history"></p>';

const start=app.querySelector('#start');const cycleLink=el('a','碳循环与氧循环填图','primary');cycleLink.href='kitar.html';cycleLink.style.cssText='display:inline-block;padding:16px 22px;border-radius:16px;text-decoration:none;font-weight:750';start.append(cycleLink);start.append(button('开始认字','primary',()=>begin('words')),button('情境挑战','secondary',()=>begin('scenes')));

function makeDeck(type){const source=type==='words'?words.map((w,i)=>({id:'word'+i,prompt:w[0],answer:w[1],explain:w[2],icon:w[3],hint:'选出对应的华文意思',pool:words.map(w=>w[1])})):scenarios.flatMap((s,i)=>[{id:'scene'+i,prompt:s[0],answer:s[1],explain:s[2],icon:s[3],hint:'这是什么生物关系？',pool:scenarios.map(s=>s[1])},{id:'sign'+i,prompt:s[1],answer:['双方获益','一方获益，另一方不受影响','一方获益，另一方受害','争夺有限资源','从死亡有机物获取养分'][i],explain:s[2],icon:s[3],hint:'选出这类关系的意思',pool:['双方获益','一方获益，另一方不受影响','一方获益，另一方受害','争夺有限资源','从死亡有机物获取养分']}]);return shuffle(source).slice(0,10)}

function study(){const field=document.getElementById('student');if(field)student=field.value.trim();app.replaceChildren();nav();const card=el('section',undefined,'card');card.append(el('h1','先认识重点字'),el('p','读国文，再看华文和例子。'));const list=el('div',undefined,'study');for(const w of words){const item=el('article',undefined,'study-item');item.append(el('strong',`${w[3]} ${w[0]}`),el('div',w[1]),el('p',w[2]));list.append(item)}card.append(list,button('自己解释全部重点','secondary next',()=>explain(0)),button('开始认字','primary next',()=>begin('words')));app.append(card);window.scrollTo(0,0)}

  input.placeholder = taskIndex < 6 ? '用一句话说出它的意思。' : '这个国文字是什么意思？';
  input.value = draft.meaning;
  input.oninput = () => { draft.meaning = input.value; };
  const message = el('p');
  message.setAttribute('role', 'status');
  const reveal = button('写好了，看参考解释和例子', 'primary next', () => {
    if (!input.value.trim()) {
      message.textContent = '先试着写一句，再看参考解释。';
      input.focus();
      return;
    }
    reveal.disabled = true;
    message.textContent = '对照参考解释，看看有没有说出重点。';
    const reference = el('div', undefined, 'feedback');
    reference.append(el('h2', '参考解释'), el('p', '国文关键词 · ' + task.keywords), el('p', task.simple), el('p', task.sample), el('p', task.malay),
      el('h2', '例子'), el('p', task.example), el('p', task.exampleMalay));
    card.append(reference);
    const practiceLabel = el('label', '现在用自己的话说明这个例子。');
    practiceLabel.htmlFor = 'ownExample';
    const exampleInput = el('textarea');
    exampleInput.id = 'ownExample';
    exampleInput.rows = 3;
    exampleInput.maxLength = 1500;
    exampleInput.placeholder = task.prompt;
    exampleInput.value = draft.example;
    exampleInput.oninput = () => { draft.example = exampleInput.value; };
    const exampleStatus = el('p');
    exampleStatus.setAttribute('role', 'status');
    const compare = button('写好了，对照例句', 'secondary next', () => {
      if (!exampleInput.value.trim()) {
        exampleStatus.textContent = '试着用一句话解释这个例子。';
        exampleInput.focus();
        return;
      }
      exampleStatus.textContent = task.sampleExample;
      compare.disabled = true;
      card.append(button(taskIndex < explanationTasks.length - 1 ? '下一个重点' : '完成，返回首页', 'primary next', () => taskIndex < explanationTasks.length - 1 ? explain(taskIndex + 1) : home()));
    });
    card.append(practiceLabel, exampleInput, compare, exampleStatus);
  });
  card.append(label, input, message, reveal, el('p', '自己的解释由你或老师对照参考答案检查。', 'note'));
  app.append(card);
  window.scrollTo(0, 0);
  input.focus();
}

home();
</script></body></html>
